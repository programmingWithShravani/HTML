<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG</title>
</head>
<body>
    <svg width="1500" height="1000" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">

  <!-- Sky -->
  <rect width="800" height="200" fill="#87CEEB"/>

  <!-- Sun -->
  <circle cx="700" cy="80" r="40" fill="#FFD700"/>

  <!-- Sea -->
  <rect y="200" width="800" height="300" fill="#1E90FF"/>

  <!-- Waves -->
  <path d="M0 200 Q40 180 80 200 T160 200 T240 200 T320 200 T400 200 T480 200 T560 200 T640 200 T720 200 T800 200"
        fill="none" stroke="white" stroke-width="4"/>

  <!-- Fish 1 -->
  <ellipse cx="200" cy="300" rx="40" ry="20" fill="orange"/>
  <polygon points="160,300 130,280 130,320" fill="orange"/>
  <circle cx="220" cy="295" r="3" fill="black"/>

  <!-- Fish 2 -->
  <ellipse cx="500" cy="350" rx="35" ry="18" fill="yellow"/>
  <polygon points="465,350 440,335 440,365" fill="yellow"/>
  <circle cx="515" cy="345" r="3" fill="black"/>

  <!-- Fish 3 -->
  <ellipse cx="650" cy="280" rx="30" ry="15" fill="#FF69B4"/>
  <polygon points="620,280 600,265 600,295" fill="#FF69B4"/>
  <circle cx="662" cy="276" r="2" fill="black"/>

  <!-- Seaweed -->
  <path d="M100 500 Q90 450 100 400 Q110 350 100 300"
        stroke="green" stroke-width="8" fill="none"/>
  <path d="M130 500 Q120 440 135 380 Q145 330 130 280"
        stroke="green" stroke-width="8" fill="none"/>

  <!-- Bubbles -->
  <circle cx="300" cy="250" r="8" fill="none" stroke="white"/>
  <circle cx="320" cy="220" r="5" fill="none" stroke="white"/>
  <circle cx="340" cy="190" r="3" fill="none" stroke="white"/>

  <circle cx="550" cy="320" r="7" fill="none" stroke="white"/>
  <circle cx="565" cy="290" r="5" fill="none" stroke="white"/>

</svg>
    <svg width="300" height="350" viewBox="0 0 300 350" xmlns="http://www.w3.org/2000/svg">

  <!-- Head -->
  <circle cx="150" cy="120" r="100" fill="#00AEEF" stroke="black" stroke-width="3"/>

  <!-- Face -->
  <circle cx="150" cy="140" r="80" fill="white" stroke="black" stroke-width="2"/>

  <!-- Eyes -->
  <ellipse cx="135" cy="90" rx="20" ry="28" fill="white" stroke="black"/>
  <ellipse cx="165" cy="90" rx="20" ry="28" fill="white" stroke="black"/>

  <!-- Pupils -->
  <circle cx="142" cy="100" r="5" fill="black"/>
  <circle cx="158" cy="100" r="5" fill="black"/>

  <!-- Nose -->
  <circle cx="150" cy="120" r="10" fill="red" stroke="black"/>

  <!-- Nose line -->
  <line x1="150" y1="130" x2="150" y2="180"
        stroke="black" stroke-width="2"/>

  <!-- Mouth -->
  <path d="M100 170 Q150 230 200 170"
        fill="none" stroke="black" stroke-width="3"/>

  <!-- Whiskers -->
  <line x1="90" y1="130" x2="130" y2="140" stroke="black"/>
  <line x1="85" y1="150" x2="130" y2="150" stroke="black"/>
  <line x1="90" y1="170" x2="130" y2="160" stroke="black"/>

  <line x1="170" y1="140" x2="210" y2="130" stroke="black"/>
  <line x1="170" y1="150" x2="215" y2="150" stroke="black"/>
  <line x1="170" y1="160" x2="210" y2="170" stroke="black"/>

  <!-- Collar -->
  <rect x="95" y="220" width="110" height="18"
        rx="8" fill="red" stroke="black"/>

  <!-- Bell -->
  <circle cx="150" cy="250" r="15"
          fill="gold" stroke="black"/>
  <line x1="140" y1="248" x2="160" y2="248"
        stroke="black"/>
  <circle cx="150" cy="255" r="3" fill="black"/>

</svg>

<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">

  <!-- Left Wings -->
  <ellipse cx="130" cy="100" rx="70" ry="90"
           fill="#ff69b4" stroke="black" stroke-width="2"
           transform="rotate(-25 130 100)" />

  <ellipse cx="130" cy="210" rx="60" ry="70"
           fill="#ffa500" stroke="black" stroke-width="2"
           transform="rotate(20 130 210)" />

  <!-- Right Wings -->
  <ellipse cx="270" cy="100" rx="70" ry="90"
           fill="#ff69b4" stroke="black" stroke-width="2"
           transform="rotate(25 270 100)" />

  <ellipse cx="270" cy="210" rx="60" ry="70"
           fill="#ffa500" stroke="black" stroke-width="2"
           transform="rotate(-20 270 210)" />

  <!-- Body -->
  <ellipse cx="200" cy="150" rx="18" ry="90"
           fill="#333" />

  <!-- Head -->
  <circle cx="200" cy="55" r="20"
          fill="#333" />

  <!-- Antennae -->
  <path d="M190 40 Q170 10 150 20"
        fill="none" stroke="black" stroke-width="2"/>
  <path d="M210 40 Q230 10 250 20"
        fill="none" stroke="black" stroke-width="2"/>

  <circle cx="150" cy="20" r="4" fill="black"/>
  <circle cx="250" cy="20" r="4" fill="black"/>

  <!-- Wing Decorations -->
  <circle cx="120" cy="90" r="15" fill="white" opacity="0.8"/>
  <circle cx="280" cy="90" r="15" fill="white" opacity="0.8"/>

  <circle cx="130" cy="210" r="12" fill="white" opacity="0.8"/>
  <circle cx="270" cy="210" r="12" fill="white" opacity="0.8"/>

</svg>

<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">

  <!-- Cricket Bat -->
  <rect x="180" y="50" width="40" height="160"
        rx="5" fill="#D2B48C" stroke="black" stroke-width="2"/>

  <!-- Bat Handle -->
  <rect x="190" y="10" width="20" height="50"
        fill="#8B4513" stroke="black" stroke-width="2"/>

  <!-- Grip Lines -->
  <line x1="190" y1="20" x2="210" y2="20" stroke="black"/>
  <line x1="190" y1="30" x2="210" y2="30" stroke="black"/>
  <line x1="190" y1="40" x2="210" y2="40" stroke="black"/>
  <line x1="190" y1="50" x2="210" y2="50" stroke="black"/>

  <!-- Cricket Ball -->
  <circle cx="320" cy="150" r="35"
          fill="#C00000" stroke="black" stroke-width="2"/>

  <!-- Ball Seam -->
  <path d="M305 120 Q320 150 305 180"
        fill="none" stroke="white" stroke-width="3"/>

  <path d="M335 120 Q320 150 335 180"
        fill="none" stroke="white" stroke-width="3"/>

  <!-- Seam Stitches -->
  <line x1="302" y1="130" x2="310" y2="125" stroke="white" stroke-width="2"/>
  <line x1="300" y1="145" x2="308" y2="140" stroke="white" stroke-width="2"/>
  <line x1="300" y1="160" x2="308" y2="155" stroke="white" stroke-width="2"/>
  <line x1="302" y1="175" x2="310" y2="170" stroke="white" stroke-width="2"/>

  <line x1="330" y1="125" x2="338" y2="130" stroke="white" stroke-width="2"/>
  <line x1="332" y1="140" x2="340" y2="145" stroke="white" stroke-width="2"/>
  <line x1="332" y1="155" x2="340" y2="160" stroke="white" stroke-width="2"/>
  <line x1="330" y1="170" x2="338" y2="175" stroke="white" stroke-width="2"/>

</svg>
<svg width="250" height="450" viewBox="0 0 250 450" xmlns="http://www.w3.org/2000/svg">

  <!-- Phone Body -->
  <rect x="25" y="10" width="200" height="430" rx="25"
        fill="#333" stroke="#111" stroke-width="4"/>

  <!-- Screen -->
  <rect x="40" y="50" width="170" height="320" rx="10"
        fill="#87CEEB"/>

  <!-- Speaker -->
  <rect x="95" y="25" width="60" height="8" rx="4"
        fill="#666"/>

  <!-- Front Camera -->
  <circle cx="175" cy="29" r="5" fill="#666"/>

  <!-- App Icons -->
  <rect x="60" y="80" width="35" height="35" rx="5" fill="#FF6B6B"/>
  <rect x="110" y="80" width="35" height="35" rx="5" fill="#4ECDC4"/>
  <rect x="160" y="80" width="35" height="35" rx="5" fill="#FFD93D"/>

  <rect x="60" y="130" width="35" height="35" rx="5" fill="#6C5CE7"/>
  <rect x="110" y="130" width="35" height="35" rx="5" fill="#00B894"/>
  <rect x="160" y="130" width="35" height="35" rx="5" fill="#E17055"/>

  <!-- Home Button -->
  <circle cx="125" cy="400" r="18"
          fill="#555" stroke="#777" stroke-width="2"/>

</svg>
<svg width="500" height="350" viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">

  <!-- Laptop Screen Frame -->

        fill="#333" stroke="#111" stroke-width="3"/>

  <!-- Webcam -->

        fill="#4CAF50"/>

</svg>
<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">

  <!-- Trunk -->
  <rect x="125" y="220" width="50" height="130"
        fill="#8B5A2B" stroke="#5C3317" stroke-width="2"/>

  <!-- Leaves -->
  <circle cx="150" cy="100" r="70" fill="#2E8B57"/>
  <circle cx="100" cy="150" r="60" fill="#3CB371"/>
  <circle cx="200" cy="150" r="60" fill="#3CB371"/>
  <circle cx="150" cy="180" r="65" fill="#228B22"/>

  <!-- Apples/Fruits -->
  <circle cx="120" cy="120" r="6" fill="red"/>
  <circle cx="180" cy="110" r="6" fill="red"/>
  <circle cx="100" cy="170" r="6" fill="red"/>
  <circle cx="200" cy="170" r="6" fill="red"/>
  <circle cx="150" cy="150" r="6" fill="red"/>

  <!-- Ground -->

           fill="#90EE90"/>

</svg>
<svg width="500" height="400" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">

  <!-- Monitor Frame -->

  <!-- Screen Content -->

        fill="#FFFFFF"/>
  <rect x="160" y="205" width="180" height="10" rx="3"
        fill="#FFFFFF"/>

  <rect x="225" y="260" width="50" height="50"
        fill="#666"/>

  <rect x="180" y="305" width="140" height="15" rx="5"
        fill="#888"/>

  <!-- Keyboard -->
  <rect x="120" y="335" width="260" height="35" rx="5"

  <!-- Keyboard Keys -->

  <!-- Mouse -->

<svg width="300" height="450" viewBox="0 0 300 450" xmlns="http://www.w3.org/2000/svg">

  <!-- Head -->
  <circle cx="150" cy="100" r="60" fill="#F4C89A" stroke="black" stroke-width="2"/>

  <!-- Eyebrows -->
  <rect x="110" y="80" width="35" height="8" rx="4" fill="black"/>
  <rect x="155" y="80" width="35" height="8" rx="4" fill="black"/>

  <!-- Eyes -->
  <circle cx="125" cy="100" r="5" fill="black"/>
  <circle cx="175" cy="100" r="5" fill="black"/>

  <!-- Mouth -->
  <ellipse cx="150" cy="130" rx="18" ry="10" fill="#FF6B6B"/>

  <!-- Hair -->
  <path d="M100 60 Q150 20 200 60" fill="none" stroke="black" stroke-width="8"/>

  <!-- Neck -->
  <rect x="140" y="155" width="20" height="15" fill="#F4C89A"/>

  <!-- Shirt -->
  <rect x="100" y="170" width="100" height="100" rx="10"
        fill="#E53935" stroke="black" stroke-width="2"/>

  <!-- Arms -->
  <line x1="100" y1="190" x2="60" y2="240"
        stroke="#F4C89A" stroke-width="16"/>
  <line x1="200" y1="190" x2="240" y2="240"
        stroke="#F4C89A" stroke-width="16"/>

  <!-- Shorts -->
  <rect x="110" y="270" width="80" height="50"
        fill="#FFD54F" stroke="black" stroke-width="2"/>

  <!-- Legs -->
  <line x1="125" y1="320" x2="120" y2="390"
        stroke="#F4C89A" stroke-width="16"/>
  <line x1="175" y1="320" x2="180" y2="390"
        stroke="#F4C89A" stroke-width="16"/>

  <!-- Shoes -->
  <ellipse cx="115" cy="405" rx="18" ry="10" fill="blue"/>
  <ellipse cx="185" cy="405" rx="18" ry="10" fill="blue"/>

</svg>
<svg width="100%" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>

  </defs>

  <rect width="1200" height="300" fill="url(#headerGradient)" />

  <circle cx="150" cy="80" r="60" fill="white" opacity="0.1"/>
  <circle cx="1050" cy="60" r="80" fill="white" opacity="0.08"/>
  <circle cx="900" cy="220" r="50" fill="white" opacity="0.1"/>

  <path d="M0 220 Q300 120 600 220 T1200 180 V300 H0 Z"
        fill="white" opacity="0.15"/>

  <path d="M0 250 Q400 150 800 240 T1200 210 V300 H0 Z"
        fill="white" opacity="0.1"/>
</svg>
<svg width="350" height="300" viewBox="0 0 350 300" xmlns="http://www.w3.org/2000/svg">

  <!-- Ears -->
  <ellipse cx="95" cy="90" rx="25" ry="45"
           fill="#8B5A2B" transform="rotate(-20 95 90)"/>
  <ellipse cx="255" cy="90" rx="25" ry="45"
           fill="#8B5A2B" transform="rotate(20 255 90)"/>

  <!-- Head -->
  <circle cx="175" cy="120" r="80"
          fill="#D2B48C" stroke="black" stroke-width="2"/>

  <!-- Eyes -->
  <circle cx="145" cy="105" r="6" fill="black"/>
  <circle cx="205" cy="105" r="6" fill="black"/>

  <!-- Nose -->
  <ellipse cx="175" cy="135" rx="12" ry="8"
           fill="black"/>

  <!-- Mouth -->

        fill="none" stroke="black" stroke-width="2"/>
  <path d="M175 143 Q190 160 205 155"
        fill="none" stroke="black" stroke-width="2"/>

  <!-- Tongue -->

           fill="#FF69B4"/>

  <!-- Body -->
  <ellipse cx="175" cy="245" rx="70" ry="45"
           fill="#D2B48C" stroke="black" stroke-width="2"/>

  <!-- Front Legs -->
  <rect x="135" y="250" width="20" height="40"
        fill="#D2B48C"/>
  <rect x="195" y="250" width="20" height="40"
        fill="#D2B48C"/>

</svg>
<svg width="350" height="350" viewBox="0 0 350 350" xmlns="http://www.w3.org/2000/svg">

  <!-- Ears -->

           fill="#FFDAB9" stroke="black" stroke-width="2"/>
  <polygon points="180,90 210,40 240,90"

  <polygon points="192,85 210,55 228,85" fill="#FFB6C1"/>

  <!-- Eyes -->
  <circle cx="145" cy="140" r="8" fill="black"/>
  <circle cx="205" cy="140" r="8" fill="black"/>

  <circle cx="208" cy="137" r="2" fill="white"/>

  <!-- Body -->
  <ellipse cx="175" cy="285" rx="70" ry="45"

  <!-- Paws -->
  <circle cx="145" cy="315" r="12" fill="#FFDAB9"/>
  <circle cx="205" cy="315" r="12" fill="#FFDAB9"/>

  <!-- Tail -->

</svg>
